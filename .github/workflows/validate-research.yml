name: Validate artist research endpoint

on:
  pull_request:
    branches: [main]
    paths:
      - "functions/api/research.js"
      - "supabase/migrations/**"
      - ".github/workflows/validate-research.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Cloudflare Function syntax
        run: node --input-type=module --check < functions/api/research.js
